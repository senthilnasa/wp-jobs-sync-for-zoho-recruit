<article class="jszr-job-card krea-card krea-card--faculty">
	<div class="krea-card__body">
		{if:employment_type}<span class="krea-card__badge">{employment_type}</span>{/if:employment_type}
		<h3 class="krea-card__title"><a class="krea-card__link" href="{permalink}">{title}</a></h3>
		<p class="krea-card__meta">{org_name}{if:location} &middot; {location}{/if:location}{if:posted_ago} &middot; Posted {posted_ago}{/if:posted_ago}</p>
	</div>
	<span class="krea-card__arrow" aria-hidden="true">
		<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
	</span>
</article>
